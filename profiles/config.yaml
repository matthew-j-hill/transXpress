executor: slurm
default-resources:
    slurm_account: jingke.weng
    slurm_partition: short
    runtime: 2880
    threads: 1
    mem: 2gb
set-resources:
    fastp_pe:
        mem: 8gb
    fastp_se:
        mem: 8gb
    fastqc_before_trim:
        mem: 4gb
        threads: 4
    fastqc_after_trim:
        mem: 4gb
        threads: 4
    multiqc_after_trim:
        mem: 4gb
    trinity:
        slurm_partition: long
        runtime: 10080
        mem: 384gb
    busco:
        mem: 10gb
        threads: 4
    transdecoder_predict:
        mem: 10gb
    download_sprot:
        mem: 4gb
    pfam_orfs:
        mem: 16gb
        runtime: 2880
    sprot_orfs:
        mem: 32gb
    kallisto:
        mem: 16gb
        threads: 8    
set-threads:
    fastp_pe: 8
    fastp_se: 8
    trinity: 16
    pfam_orfs: 16
    sprot_orfs: 16
restart-times: 2
latency-wait: 60
jobs: 1000
rerun-incomplete: True
