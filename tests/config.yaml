# Input file with seq reads, ex.
#                                        cond_A    cond_A_rep1    A_rep1_left.fq    A_rep1_right.fq
#                                        cond_A    cond_A_rep2    A_rep2_left.fq    A_rep2_right.fq
#                                        cond_B    cond_B_rep1    B_rep1_left.fq    B_rep1_right.fq
#                                        cond_B    cond_B_rep2    B_rep2_left.fq    B_rep2_right.fq
# Note: must avoid spaces in filenames in samples.txt
samples_file: "test_samples.txt"

# fastp trimming/filtering. Quality trimming is deliberately gentle (Q5): aggressive
# trimming reduces de novo assembly completeness (MacManes 2014, Front Genet 5:13).
# --trim_poly_g forces poly-G removal (2-colour chemistry) even when read headers
# don't identify the instrument (e.g. SRA downloads).
fastp_parameters: "--adapter_fasta ../adapters.fasta --detect_adapter_for_pe --trim_poly_g --cut_front --cut_tail --cut_mean_quality 5 --length_required 25"

# set to trinity or rnaspades
assembler: "trinity"

# may consider canging TRINITY_PARAMS += "  --min_kmer_cov 1 --min_glue 2  --no_normalize_reads"
trinity_parameters: "--seqType fq"


# Strand-specific RNA-Seq read orientation.
# if paired: RF or FR,
# if single: F or R.   (dUTP method = RF)
# This parameter is used for both Trinity and read alignment steps
# strand_specific: --SS_lib_type RF
strand_specific: ""


# For Pfam (hmmsearch) and SwissProt (DIAMOND) searches used by TransDecoder.Predict
e_value_threshold: "1e-6"

# Dispersion value for edgeR differential expression analysis 
dispersion: "0.1"
